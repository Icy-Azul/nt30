name: Reset a password
on:
  workflow_dispatch:
    inputs:
      username:
        description: "Their username"
        required: true
      new_password:
        description: "New password (at least 6 characters). Tell them to save it."
        required: true
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notify/package-lock.json
      - run: npm ci --omit=dev
        working-directory: notify
      - run: echo "::add-mask::${{ github.event.inputs.new_password }}"
      - run: node reset.js
        working-directory: notify
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          RESET_USER: ${{ github.event.inputs.username }}
          RESET_PW: ${{ github.event.inputs.new_password }}
